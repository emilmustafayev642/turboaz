{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex | Login page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="{% static 'image/favicon.svg' %}?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'image/favicon.png' %}?v=2">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>

    <div>
        <a href="{% url 'home' %}" aria-label="APEX home">
            <img class="navbar-logo" src="{% static 'image/APEX — Automotive logo.svg' %}" alt="APEX">
        </a>
        <div class="container">
            <div class="row">
                <div class="col-md-6 ">
                    <h1 class="h1">Open the doors to your garage.</h1>
                    <p class="login-intro">Sign in to continue to APEX.</p>
                    <form class="login-form" method="post" action="{% url 'login' %}">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ next }}">
                        {{ form.non_field_errors }}
                        <div class="form-group">
                            <label for="username">Username:</label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
                            {{ form.username.errors }}
                        </div>
                        <div class="form-group">
                            <label for="password">Password:</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                            {{ form.password.errors }}
                        </div>
                        <button type="submit" class="btn login-submit">Sign In</button>
                    </form>
                </div>

                <div class="col-md-6 login-image-column">
                    <img src="{% static 'image/login-image.png' %}" alt="Car" class="login-car-image">
                </div>
            </div>
        </div>

    </div>




    <script type="text/javascript" src="//code.jquery.com/jquery-1.11.0.min.js"></script>
  <script type="text/javascript" src="//code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
    crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script>  


<script>
    const loginCarImage = document.querySelector(".login-car-image");
    const loginCarImages = [
        "{% static 'image/login-image.png' %}",
        "{% static 'image/login-image-2.png' %}",
        "{% static 'image/login-image-3.png' %}"
    ];
    let currentCarImage = 0;

    window.setInterval(() => {
        loginCarImage.classList.add("is-fading");
        window.setTimeout(() => {
            currentCarImage = (currentCarImage + 1) % loginCarImages.length;
            loginCarImage.src = loginCarImages[currentCarImage];
            loginCarImage.classList.remove("is-fading");
        }, 350);
    }, 2000);
</script>

</body>
</html>
